events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Cache static JS/CSS chunks aggressively (they have content-hash filenames)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Prerendered pages (build/<route>/index.html, written by scripts/postbuild-seo.mjs)
        # are served directly; other SPA routes fall back to the plain app shell.
        # `expires -1` (not add_header) keeps the server-level security headers.
        location / {
            expires -1;
            try_files $uri $uri/index.html /app-shell.html;
        }

        location = /sitemap.xml {
            expires 1h;
        }

        location = /robots.txt {
            expires 1h;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
